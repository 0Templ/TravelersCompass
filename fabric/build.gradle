plugins {
    id 'multiloader-loader'
    id 'com.gradleup.shadow'
    id "me.shedaniel.unified-publishing"
    id 'net.fabricmc.fabric-loom'
}

fabricApi {
    configureDataGeneration()
}


dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"


    implementation 'com.electronwill.night-config:core:3.6.6'
    implementation 'com.electronwill.night-config:toml:3.6.6'
    shadow 'com.electronwill.night-config:core:3.6.6'
    shadow 'com.electronwill.night-config:toml:3.6.6'

}

shadowJar {
    configurations = [project.configurations.shadow]
    destinationDirectory.set(file("${project.layout.buildDirectory.get()}/libs"))
    archiveClassifier.set("")
    relocate "com.electronwill.nightconfig", "${project.group}.shadow.nightconfig"
}

tasks.named("jar", Jar) {
    archiveClassifier.set("slim")
}

tasks.named("assemble") {
    dependsOn(tasks.named("shadowJar"))
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }


}

configureUnifiedPublishing(project, [
        loaderName: "Fabric",
        gameLoader: "fabric",
        releaseType: rootProject.fabric_release_type,
        publicationTask: "shadowJar",
        relations: {
            depends {
                modrinth = "fabric-api"
                curseforge = "fabric-api"
            }
        }
])
