plugins {
    id 'multiloader-loader'
    id 'com.gradleup.shadow'
    id 'me.shedaniel.unified-publishing'
    id 'net.fabricmc.fabric-loom'
}

fabricApi {
    configureDataGeneration()
}

def nightConfigVersion = '3.6.6'
def shadowedDeps = [
        "com.electronwill.night-config:core:$nightConfigVersion",
        "com.electronwill.night-config:toml:$nightConfigVersion"
]

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    //Mod Menu
    implementation("com.terraformersmc:modmenu:${mod_menu_version}")

    // Jei
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"

    // REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    compileOnly "dev.architectury:architectury-fabric:${architectury_fabric_version}"

    // Jade
    compileOnly "maven.modrinth:jade:${jade_fabric_version}+fabric"

    // Lootr
    compileOnly "maven.modrinth:lootr:${lootr_version}"

    switch (nei) {
        case "JEI":
            runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
            break
        case "REI":
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
            runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
            runtimeOnly "dev.architectury:architectury-fabric:${architectury_fabric_version}"
            break
        case "EMI":
            break
    }

    switch (waila) {
        case "JADE":
            runtimeOnly "maven.modrinth:jade:${jade_fabric_version}+fabric"
            break
        case "TOP":
            break
    }
    runtimeOnly "maven.modrinth:lootr:${lootr_version}"

    shadowedDeps.each {
        implementation it
        shadow it
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    destinationDirectory = layout.buildDirectory.dir("libs").get().asFile
    archiveClassifier = ''
    relocate 'com.electronwill.nightconfig', "${project.group}.shadow.nightconfig"
}

assemble.dependsOn shadowJar

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath = aw
    }

    mixin.defaultRefmapName = "${mod_id}.refmap.json"

    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated = true
            runDir = 'runs/client'
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated = true
            runDir = 'runs/server'
        }
    }
}

configureUnifiedPublishing(project, [
        loaderName: 'Fabric',
        gameLoader: 'fabric',
        releaseType: rootProject.fabric_release_type,
        publicationTask: 'shadowJar',
        relations: {
            depends {
                modrinth = 'fabric-api'
                curseforge = 'fabric-api'
            }
        }
])
