modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/travelerscompass/icon.png"
logoBlur = false
authors = "${mod_author}"
description = '''${description}'''
displayURL = "https://github.com/0Templ/TravelersCompass"
updateJSONURL = "https://raw.githubusercontent.com/0Templ/ModVersions/main/forge/travelers-compass/v1/${minecraft_version}.json"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
