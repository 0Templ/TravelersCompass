plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id "me.shedaniel.unified-publishing" version "0.1.+" apply false
    id 'com.gradleup.shadow' version '8.3.10' apply(false)
}

allprojects {
    repositories {
        maven {
            url = "https://modmaven.dev"
        }
        maven {
            url 'https://maven.blamejared.com/'
            content {
                includeGroup 'noobanidus.mods.lootr'
            }
        }
        maven {
            url "https://maven.shedaniel.me"
        }
        maven {
            url "https://api.modrinth.com/maven"
        }
        maven {
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }
}

static def getModNameForPublishing(String name) {
    return name.replaceAll(/\s+/, '')
}

def changelogForVersion(String version) {
    def file = file("${rootDir}/CHANGELOG.md")
    if (!file.exists()) return ""

    def text = file.text

    def pattern = ~/(?ms)^##\s*\[?${version}\]?[^\n]*\n(.*?)(?=^##\s|\z)/
    def matcher = text =~ pattern

    if (matcher.find()) {
        def entry = matcher.group(1).trim()
        return entry ?: ""
    }

    pattern = "(?ms)^##\\s*\\[?${version}\\]?\\s*(.*)\$"
    matcher = text =~ pattern
    return matcher.find() ? matcher.group(1).trim() : ""
}

ext.configureUnifiedPublishing = { p, cfg ->
    p.unifiedPublishing {
        project {
            displayName = "[${cfg.loaderName}]${getModNameForPublishing(p.mod_name)}-${p.display_minecraft_version}-${p.version}"
            releaseType = cfg.releaseType
            changelog = changelogForVersion(p.version.toString())


            def publishGameVersions = (
                    p.findProperty("publish_game_versions")
                            ?: p.minecraft_version.toString()
            ).toString()
                    .split(',')
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }

            gameVersions = publishGameVersions

            gameLoaders = [cfg.gameLoader]
            mainPublication p.tasks.named(cfg.publicationTask).get()

            if (cfg.relations instanceof Closure) {
                relations(cfg.relations as Closure)
            } else if (cfg.relationsDepends instanceof Map && !cfg.relationsDepends.isEmpty()) {
                relations {
                    depends {
                        cfg.relationsDepends.each { platform, dependencyId ->
                            setProperty(platform.toString(), dependencyId)
                        }
                    }
                }
            }

            def mrToken = p.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
            def mrId = (p.findProperty("modrinth_project_id") ?: "").toString().trim()
            if (mrToken != null && !mrId.isEmpty()) {
                modrinth {
                    token = mrToken
                    id = mrId
                    version = p.version.toString()
                }
            }

            def cfToken = p.findProperty("CURSEFORGE_TOKEN") ?: System.getenv("CURSEFORGE_TOKEN")
            def cfId = (p.findProperty("curseforge_project_id") ?: "").toString().trim()
            if (cfToken != null && !cfId.isEmpty()) {
                curseforge {
                    token = cfToken
                    id = cfId
                }
            }
        }
    }
}
