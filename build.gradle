plugins {

    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.0.0-beta.2' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply(false)

}

allprojects {
    repositories {
        maven {
            url = "https://modmaven.dev"
        }
        maven {
            url 'https://maven.blamejared.com/'
            content {
                includeGroup 'noobanidus.mods.lootr'
            }
        }
        maven {
            url "https://maven.shedaniel.me"
        }
        maven {
            url "https://api.modrinth.com/maven"
        }
        maven {
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }
}

static def getModNameForPublishing(String name){
    return name.replaceAll(/\s+/, '')
}

def changelogForVersion(String version) {
    def file = file("${rootDir}/CHANGELOG.md")
    if (!file.exists()) return ""

    def text = file.text

    def pattern = ~/(?ms)^##\s*\[?${version}\]?[^\n]*\n(.*?)(?=^##\s|\z)/
    def matcher = text =~ pattern

    if (matcher.find()) {
        def entry = matcher.group(1).trim()
        return entry ?: ""
    }

    pattern = "(?ms)^##\\s*\\[?${version}\\]?\\s*(.*)\$"
    matcher = text =~ pattern
    return matcher.find() ? matcher.group(1).trim() : ""
}

static def toReleaseType(Object value) {
    def v = (value ?: "stable").toString().trim().toUpperCase()
    if (v == "RELEASE") v = "STABLE"
    return Enum.valueOf(me.modmuss50.mpp.ReleaseType, v)
}

static def csv(Object value) {
    if (value == null) return []
    return value.toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

ext.configurePublishing = { p, cfg ->
    p.publishMods {
        // -PdryRun=true/false
        dryRun = p.providers.gradleProperty("dryRun").map { it.toBoolean() }.getOrElse(false)

        file = p.tasks.named(cfg.publicationTask, Zip).flatMap { it.archiveFile }
        changelog = changelogForVersion(p.version.toString())
        type = toReleaseType(cfg.releaseType)
        displayName = "[${cfg.loaderName}]${getModNameForPublishing(p.mod_name)}-${p.minecraft_version}-${p.version}"

        modLoaders.add(cfg.gameLoader)

        def gameVersions = csv(
                p.findProperty("publish_game_versions") ?: p.minecraft_version
        )

        def cfToken = System.getenv("CURSEFORGE_TOKEN") ?: p.findProperty("CURSEFORGE_TOKEN")
        def cfId = (p.findProperty("curseforge_project_id") ?: "").toString().trim()
        if (cfToken != null && !cfId.isEmpty()) {
            curseforge {
                accessToken = cfToken
                projectId = cfId
                client = true
                server = true

                csv(p.findProperty("publish_game_versions_curseforge") ?: gameVersions.join(','))
                        .each { minecraftVersions.add(it) }

                cfg.requiredMods?.each { requires(it) }
            }
        }

        def mrToken = System.getenv("MODRINTH_TOKEN") ?: p.findProperty("MODRINTH_TOKEN")
        def mrId = (p.findProperty("modrinth_project_id") ?: "").toString().trim()
        if (mrToken != null && !mrId.isEmpty()) {
            modrinth {
                accessToken = mrToken
                projectId = mrId

                csv(p.findProperty("publish_game_versions_modrinth") ?: gameVersions.join(','))
                        .each { minecraftVersions.add(it) }

                cfg.requiredMods?.each { requires(it) }
            }
        }
    }
}
