plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.97' apply false
    id "me.shedaniel.unified-publishing" version "0.1.+" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply(false)
}

allprojects {
    repositories {
        maven {
            url = "https://modmaven.dev"
        }
        maven {
            url 'https://maven.blamejared.com/'
            content {
                includeGroup 'noobanidus.mods.lootr'
            }
        }
        maven {
            url "https://maven.shedaniel.me"
        }
        maven {
            url "https://api.modrinth.com/maven"
        }
        maven {
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }
}

static def getModNameForPublishing(String name){
    return name.replaceAll(/\s+/, '')
}

def changelogForVersion(String version) {
    def file = file("${rootDir}/CHANGELOG.md")
    if (!file.exists()) return ""

    def text = file.text

    def pattern = ~/(?ms)^##\s*\[?${version}\]?[^\n]*\n(.*?)(?=^##\s|\z)/
    def matcher = text =~ pattern

    if (matcher.find()) {
        def entry = matcher.group(1).trim()
        return entry ?: ""
    }

    pattern = "(?ms)^##\\s*\\[?${version}\\]?\\s*(.*)\$"
    matcher = text =~ pattern
    return matcher.find() ? matcher.group(1).trim() : ""
}