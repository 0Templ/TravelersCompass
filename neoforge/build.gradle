plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {

    //JEI
    compileOnly ("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    //REI
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    //EMI
    compileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api"

    switch (nei) {
        case "JEI":
            runtimeOnly ("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
            break
       case "REI":
            runtimeOnly ("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
            break
        case "EMI":
            runtimeOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
            break

    }

    //Jade
    compileOnly ("maven.modrinth:jade:${jade_version}+neoforge")

    //The One Probe
    compileOnly "curse.maven:the-one-probe-${top_curse_project_id}:${top_curse_file_id}"

    switch (waila) {
        case "JADE":
            runtimeOnly ("maven.modrinth:jade:${jade_version}+neoforge")
            break
        case "TOP":
            runtimeOnly "curse.maven:the-one-probe-${top_curse_project_id}:${top_curse_file_id}"
            break
    }

    //Lootr
    compileOnly "noobanidus.mods.lootr:lootr-neoforge:${lootr_version}"
    if (!project.gradle.startParameter.taskNames.contains("runData")){
        runtimeOnly "noobanidus.mods.lootr:lootr-neoforge:${lootr_version}"
    }


}

sourceSets.main.resources { srcDir 'src/generated/resources' }
