modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "assets/travelerscompass/icon.png"
logoBlur = false
authors = "${mod_author}"
description = '''${description}'''
displayURL = "https://github.com/0Templ/TravelersCompass"
updateJSONURL = "https://raw.githubusercontent.com/0Templ/ModVersions/main/neoforge/travelers-compass/v1/${minecraft_version}.json"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
